<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>痛かったら手を挙げてください | 歯医者バカゲー</title>
<meta name="description" content="歯医者の「痛かったら手を挙げてください」。でも先生は見ていない。ドリルの音と先生の鼻歌、助手の視線を読んで、見られる瞬間に手を挙げろ。ブラウザで遊べるバカゲー。">
<meta name="theme-color" content="#e9e4da">
<meta property="og:type" content="website">
<meta property="og:title" content="痛かったら手を挙げてください">
<meta property="og:description" content="歯医者で手を挙げても気づかれない。鼻歌が止まる瞬間を読んで挙げろ。">
<meta property="og:image" content="https://tom3games.github.io/dentist-hand/og.png?v=1">
<meta property="og:url" content="https://tom3games.github.io/dentist-hand/">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="痛かったら手を挙げてください">
<meta name="twitter:description" content="歯医者で手を挙げても気づかれない。鼻歌が止まる瞬間を読んで挙げろ。">
<meta name="twitter:image" content="https://tom3games.github.io/dentist-hand/og.png?v=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M14 10c8-4 14 2 18 2s10-6 18-2c8 5 6 18 2 26-3 6-4 20-9 20-5 0-4-14-11-14s-6 14-11 14c-5 0-6-14-9-20-4-8-6-21 2-26z' fill='%23fbfaf6' stroke='%23234' stroke-width='4'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Klee+One:wght@600&display=swap" rel="stylesheet">
<style>
[hidden]{display:none!important}
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#22272b;--sub:#5d6467;--paper:#fbfaf6;--paper2:#efe9dc;--mint:#3d8f86;--mint-dk:#245e58;--red:#c8322b;--ceil:#e9e4da;
  --ui:"BIZ UDPGothic","Hiragino Sans","Yu Gothic",sans-serif;--hand:"Klee One","Hiragino Mincho ProN",serif;
}
html{background:#d9d3c6;touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{font-family:var(--ui);color:var(--ink);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overflow:hidden;height:100svh}
button,canvas,a{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;color:inherit;background:none;border:0;cursor:pointer}
.view{position:fixed;inset:0;height:100svh;overflow:hidden}
#boot-err{position:fixed;inset:auto 8px 8px 8px;z-index:99;background:#fff;color:#b00;font:12px/1.4 monospace;white-space:pre-wrap;padding:10px;border-radius:8px}

/* ---------- ロード画面: 歯と手鏡 ---------- */
#vLoad{background:#efe9dc;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;z-index:50}
#vLoad svg{width:120px;height:120px}
#mirror{transform-origin:60px 60px;animation:orbit 2.4s linear infinite}
@keyframes orbit{to{transform:rotate(360deg)}}
#loadTxt{font-size:15px;letter-spacing:.08em;color:var(--sub)}
#loadBar{width:160px;height:3px;background:#d8d0c0;overflow:hidden}
#loadBar i{display:block;height:100%;width:0;background:var(--mint);transition:width .2s}

/* ---------- 共通の背景: 天井 ---------- */
.ceil{position:absolute;left:50%;top:50%;width:max(100vw,66.7svh);aspect-ratio:2/3;transform:translate(-50%,-50%);background:#e9e4da url(img/bg.webp?v=1) center/cover no-repeat}

/* ---------- タイトル: 診察券 ---------- */
#vTitle{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom))}
#vTitle .ceil{filter:blur(2px) brightness(1.03)}
#vTitle .veil{position:absolute;inset:0;background:radial-gradient(60% 30% at 50% 22%,rgba(255,250,235,.85),rgba(255,250,235,0) 70%)}
.card{position:relative;width:min(92vw,360px);background:var(--paper);border-radius:10px;padding:16px 18px 18px;box-shadow:0 18px 40px -18px rgba(40,30,20,.55);transform:rotate(-2.2deg);margin-top:4svh}
.card .top{display:flex;align-items:center;gap:8px;border-bottom:2px solid var(--mint);padding-bottom:8px;margin-bottom:12px}
.card .logo{width:26px;height:26px;flex:none}
.card .clinic{font-weight:700;font-size:17px;color:var(--mint-dk);letter-spacing:.06em}
.card .no{margin-left:auto;font-size:11px;color:var(--sub)}
.card h1{font-size:clamp(28px,9vw,38px);line-height:1.18;font-weight:700;letter-spacing:.01em}
.card h1 span{display:block}
.card h1 .l2{color:var(--mint-dk)}
.card .sub{margin-top:10px;font-size:13px;color:var(--sub)}
.card .row{display:flex;justify-content:space-between;align-items:flex-end;margin-top:14px;font-family:var(--hand);font-size:15px}
.card .row b{font-weight:600;border-bottom:1px solid #b9b2a3;padding:0 18px 0 2px}
.card .appt{width:58px;height:58px;border:2px solid var(--red);border-radius:50%;color:var(--red);font-size:11px;line-height:1.15;display:grid;place-items:center;text-align:center;transform:rotate(12deg);opacity:.85;font-weight:700}
#bStart{position:relative;margin-top:7svh;min-width:220px;height:58px;padding:0 28px;border-radius:30px;background:var(--mint);color:#fff;font-size:20px;font-weight:700;letter-spacing:.12em;box-shadow:0 5px 0 var(--mint-dk)}
#bStart:active{transform:translateY(3px);box-shadow:0 2px 0 var(--mint-dk)}
.small{position:relative;display:flex;gap:6px;margin-top:3svh}
.small button{min-height:44px;padding:0 14px;font-size:15px;color:var(--ink);background:rgba(251,250,246,.72);border-radius:6px}

/* ---------- 遊び方: 問診票 ---------- */
#vHow{background:#d6d0c3;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:max(14px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom))}
.sheet{width:min(94vw,380px);background:var(--paper);padding:16px 16px 12px;box-shadow:0 10px 26px -14px rgba(0,0,0,.5);transform:rotate(.8deg);position:relative}
.sheet::before{content:"";position:absolute;top:-10px;left:50%;width:70px;height:20px;margin-left:-35px;background:#9aa4a6;border-radius:3px}
.sheet h2{font-size:20px;letter-spacing:.3em;text-align:center;padding-bottom:8px;border-bottom:1px solid #b9b2a3}
.sheet ol{list-style:none;margin-top:6px}
.sheet li{display:grid;grid-template-columns:20px 1fr;gap:2px 8px;padding:7px 0;border-bottom:1px dashed #cfc7b7;align-items:start}
.sheet li i{grid-row:span 2;width:16px;height:16px;border:1.5px solid var(--ink);margin-top:2px;position:relative}
.sheet li i::after{content:"";position:absolute;left:3px;top:-3px;width:6px;height:12px;border:solid var(--red);border-width:0 2.5px 2.5px 0;transform:rotate(40deg)}
.sheet li b{font-size:13px;color:var(--sub);font-weight:400}
.sheet li span{font-family:var(--hand);font-size:17px;line-height:1.3}
.sheet .who{display:flex;gap:6px;margin-top:8px;align-items:center}
.sheet .who img{width:44px;height:44px;object-fit:cover;object-position:top;border-radius:50%;background:#e8e2d5}
.sheet .who small{font-size:12.5px;color:var(--sub);line-height:1.35}
.howBtns{display:flex;gap:10px;margin-top:14px;align-items:center}
#bHowGo{min-width:170px;height:50px;border-radius:26px;background:var(--mint);color:#fff;font-size:18px;font-weight:700;letter-spacing:.1em}
#bHowBack{min-height:44px;padding:0 14px;font-size:14px}
.foot{margin-top:10px;font-size:12px;color:#5d6467;text-align:center;line-height:1.5}
.foot a{color:#38505a;display:inline-flex;align-items:center;min-height:38px;padding:0 8px}

/* ---------- 診察中 ---------- */
#vPlay{background:#e9e4da}
#stage{position:absolute;inset:0;transition:transform 1.2s cubic-bezier(.4,0,.2,1)}
#stage.up{transform:translateY(-5%)}
#ceilP{will-change:transform,filter}
.lamp{position:absolute;left:50%;top:31%;width:120%;aspect-ratio:1;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(255,248,226,.95) 0,rgba(255,240,205,.55) 12%,rgba(255,240,205,0) 42%);pointer-events:none;mix-blend-mode:screen}
.ppl{position:absolute;pointer-events:none;will-change:transform}
.ppl img{position:absolute;inset:0;width:100%;height:auto;opacity:0;transition:opacity .12s}
.ppl img.on{opacity:1}
#doc{left:-17%;top:2%;width:86%;aspect-ratio:380/620;transition:transform .35s;-webkit-mask-image:linear-gradient(to bottom,#000 60%,transparent 90%);mask-image:linear-gradient(to bottom,#000 60%,transparent 90%)}
#doc.look{transform:scale(1.07) translateY(2%)}
#asst{right:-19%;top:13%;width:64%;aspect-ratio:380/620;-webkit-mask-image:linear-gradient(to bottom,#000 58%,transparent 88%);mask-image:linear-gradient(to bottom,#000 58%,transparent 88%)}
#bib{position:absolute;left:-8%;right:-8%;bottom:-4%;height:30%;pointer-events:none;background:radial-gradient(120% 90% at 50% 100%,#8fb7c9 0,#a9cad8 45%,rgba(190,214,224,.0) 78%);filter:blur(5px)}
#asst img{transform:scaleX(-1)}
#drill{position:absolute;left:14%;top:57%;width:30%;transform-origin:50% 50%;pointer-events:none;opacity:0;transition:opacity .25s;filter:blur(.6px) drop-shadow(0 8px 10px rgba(0,0,0,.25))}
#drill.on{opacity:1}
#drill img{width:100%;display:block;transform:rotate(108deg)}
#glow{position:absolute;inset:0;pointer-events:none;background:radial-gradient(70% 45% at 50% 28%,rgba(255,252,240,1),rgba(255,252,240,0) 70%);opacity:.15;mix-blend-mode:screen}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(80% 70% at 50% 45%,rgba(0,0,0,0) 45%,rgba(30,10,10,.75));opacity:0}
.sweat{position:absolute;width:16px;height:24px;filter:blur(.8px);border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:radial-gradient(circle at 35% 35%,rgba(255,255,255,.95),rgba(200,225,240,.55) 55%,rgba(150,190,210,.3));pointer-events:none;opacity:0}
#feet{position:absolute;left:1%;bottom:-6%;width:25%;aspect-ratio:262/420;pointer-events:none;filter:blur(.6px) sepia(.12) brightness(.9)}
#feet img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:bottom;opacity:0}
#feet img.on{opacity:1}
#bHand{position:absolute;right:0;bottom:0;width:58%;height:40%;z-index:5}
#hand{position:absolute;right:6%;bottom:-20%;width:44%;filter:sepia(.14) saturate(.92) brightness(.96) drop-shadow(0 -6px 14px rgba(60,40,20,.25));aspect-ratio:281/560;pointer-events:none;transition:bottom .16s ease-out}
#hand img[data-k=rest]{transform:rotate(-64deg) translate(-8%,30%)}
#hand img[data-k=fist]{transform:rotate(-30deg) translate(-6%,2%)}
#hand img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:bottom;opacity:0}
#hand img.on{opacity:1}
#hand.up{bottom:2%}
#hand.tired img{animation:tired .35s}
@keyframes tired{30%{transform:translateY(4%) rotate(-3deg)}70%{transform:translateY(2%) rotate(2deg)}}
#hint{position:absolute;right:20%;bottom:9%;width:58px;height:58px;border-radius:50%;border:3px solid rgba(255,255,255,.95);box-shadow:0 0 0 3px rgba(61,143,134,.6);pointer-events:none;animation:ping 1.1s ease-out infinite;z-index:6}
@keyframes ping{0%{transform:scale(.6);opacity:1}100%{transform:scale(1.5);opacity:0}}
.say{position:absolute;max-width:62%;padding:7px 11px;font-size:16px;line-height:1.3;font-weight:700;pointer-events:none;z-index:4;white-space:nowrap}
#say.d{left:5%;top:47%;background:#fff;border-radius:12px 12px 12px 2px;box-shadow:0 2px 8px rgba(0,0,0,.18)}
#say.a{right:5%;top:52%;background:#fff6f7;border-radius:12px 12px 2px 12px;color:#7a2834;box-shadow:0 2px 8px rgba(0,0,0,.18)}
#say.k{left:4%;top:66%;background:#fffbe6;border-radius:12px;font-size:14px}
#say.p{left:50%;bottom:31%;transform:translateX(-50%);background:rgba(34,39,43,.85);color:#fff;border-radius:12px;font-weight:400}
#say.hum{font-style:italic;font-weight:400;color:#38505a;background:rgba(255,255,255,.8)}
#say small{display:block;font-size:10px;color:#8a7d5a;font-weight:400}
#zz{position:absolute;left:40%;top:62%;font-weight:700;color:#22272b;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 6px #fff;pointer-events:none;z-index:3;transform-origin:left center;white-space:nowrap;font-size:16px;opacity:0}
#mon{position:absolute;right:3%;top:max(10px,env(safe-area-inset-top));width:118px;z-index:4;pointer-events:none}
#mon .rod{width:6px;height:12px;margin:0 auto;background:linear-gradient(90deg,#8c9294,#d4d8d9,#8c9294)}
#mon .scr{background:#0f1416;border:3px solid #2a2f31;border-radius:3px;padding:5px 8px;color:#9fe3cf;font:700 13px/1.25 ui-monospace,Menlo,monospace;transform:perspective(300px) rotateX(16deg);box-shadow:0 6px 10px -6px rgba(0,0,0,.6)}
#mon .scr small{display:block;font-size:10px;color:#6aa595;font-weight:400}
#bMute{position:absolute;left:3%;top:max(10px,env(safe-area-inset-top));width:44px;height:44px;border-radius:50%;z-index:6;background:radial-gradient(circle,#f3f1ec 0 30%,transparent 31%),repeating-radial-gradient(circle,#cfcac0 0 2px,#e9e5dc 2px 5px);box-shadow:inset 0 0 0 2px #bdb6a8;font-size:12px;font-weight:700;color:#38505a}
#bMute.off{color:var(--red)}
#tut{position:absolute;inset:0;z-index:8;background:rgba(20,24,26,.45);display:flex;align-items:center;justify-content:center;padding:16px}
#tut .tc{background:var(--paper);padding:16px 20px;border-radius:8px;max-width:300px;text-align:center;box-shadow:0 10px 24px -10px rgba(0,0,0,.5);transform:translateY(-12svh)}
#tut p{font-size:21px;font-weight:700;line-height:1.4}
#tut button{margin-top:12px;min-height:44px;padding:0 22px;border-radius:22px;background:var(--mint);color:#fff;font-size:16px;font-weight:700}
#tut.live{background:rgba(20,24,26,.18);pointer-events:none}
#tut.live{align-items:flex-end;padding-bottom:42svh}
#tut.live .tc{transform:none;padding:10px 16px}
#tut.live p{font-size:18px}

/* ---------- 結果: カルテ ---------- */
#vResult{background:#cfc8b9;display:flex;flex-direction:column;align-items:center;padding:max(10px,env(safe-area-inset-top)) 12px max(10px,env(safe-area-inset-bottom))}
#kWrap{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
#karte{display:block;box-shadow:0 12px 26px -12px rgba(0,0,0,.55);background:var(--paper)}
#rBtns{display:flex;gap:8px;margin-top:10px;align-items:center;flex-wrap:wrap;justify-content:center}
#bAgain{min-width:132px;height:48px;padding:0 18px;border-radius:24px;background:var(--mint);color:#fff;font-size:17px;font-weight:700;box-shadow:0 4px 0 var(--mint-dk)}
#rBtns .s{min-height:40px;padding:0 12px;font-size:13.5px;background:rgba(251,250,246,.75);border-radius:6px}
#rMsg{position:absolute;left:50%;top:40%;transform:translateX(-50%);background:rgba(34,39,43,.9);color:#fff;padding:8px 14px;border-radius:6px;font-size:14px;pointer-events:none}
@media (max-height:700px){
  .card{padding:12px 14px 14px}.card h1{font-size:28px}#bStart{margin-top:4svh;height:52px}.small{margin-top:2svh}
  .sheet li{padding:5px 0}.sheet li span{font-size:15.5px}.sheet .who{margin-top:5px}.howBtns{margin-top:8px}
  #bAgain{height:44px}#rBtns .s{min-height:38px}
  .say{font-size:15px}
}
</style>
</head>
<body>
<main id="vLoad" class="view">
  <svg viewBox="0 0 120 120" aria-hidden="true">
    <path d="M38 34c9-5 15 2 22 2s13-7 22-2c9 6 7 21 3 30-3 7-4 24-10 24-6 0-5-17-15-17s-9 17-15 17c-6 0-7-17-10-24-4-9-6-24 3-30z" fill="#fbfaf6" stroke="#22272b" stroke-width="3"/>
    <g id="mirror"><line x1="60" y1="14" x2="60" y2="2" stroke="#8c9294" stroke-width="3"/><circle cx="60" cy="18" r="7" fill="#cfe3e4" stroke="#6e7779" stroke-width="2"/></g>
  </svg>
  <div id="loadTxt">診察券を確認中</div>
  <div id="loadBar"><i></i></div>
</main>

<main id="vTitle" class="view" hidden>
  <div class="ceil"></div><div class="veil"></div>
  <div class="card">
    <div class="top">
      <svg class="logo" viewBox="0 0 64 64"><path d="M14 10c8-4 14 2 18 2s10-6 18-2c8 5 6 18 2 26-3 6-4 20-9 20-5 0-4-14-11-14s-6 14-11 14c-5 0-6-14-9-20-4-8-6-21 2-26z" fill="#fff" stroke="#245e58" stroke-width="4"/></svg>
      <span class="clinic" data-t="clinic"></span><span class="no" data-t="cardNo"></span>
    </div>
    <h1><span data-t="title1"></span><span class="l2" data-t="title2"></span></h1>
    <p class="sub" data-t="sub"></p>
    <div class="row"><b data-t="patient"></b><span class="appt">11/7<br>14:30</span></div>
  </div>
  <button id="bStart" data-t="start"></button>
  <div class="small"><button id="bHow" data-t="how"></button><button id="bLang" data-t="lang"></button><button id="bSnd"></button></div>
</main>

<main id="vHow" class="view" hidden>
  <div class="sheet">
    <h2 data-t="howTitle"></h2>
    <ol id="howList"></ol>
    <div class="who"><img src="img/dentist_look.webp?v=1" alt=""><img src="img/assistant_look.webp?v=1" alt=""><img src="img/director_look.webp?v=1" alt=""><small id="howWho"></small></div>
  </div>
  <div class="howBtns"><button id="bHowBack" data-t="back"></button><button id="bHowGo" data-t="howGo"></button></div>
  <div class="foot"><span data-t="credit"></span><br><a href="privacy.html" target="_blank" rel="noopener" data-t="privacy"></a></div>
</main>

<main id="vPlay" class="view" hidden>
  <div id="stage">
    <div class="ceil" id="ceilP"></div>
    <div class="lamp"></div>
    <div class="ppl" id="doc"><img data-k="down"><img data-k="look"><img data-k="away"></div>
    <div class="ppl" id="asst"><img data-k="look" src="img/assistant_look.webp?v=1"><img data-k="glare" src="img/assistant_glare.webp?v=1"><img data-k="away" src="img/assistant_away.webp?v=1"></div>
    <div id="drill"><img src="img/drill.webp?v=1" alt=""></div>
    <div id="bib"></div>
    <div id="feet"><img data-k="rest" src="img/feet_rest.webp?v=1" class="on"><img data-k="curl" src="img/feet_curl.webp?v=1"></div>
    <div id="glow"></div>
    <div id="vig"></div>
  </div>
  <div id="hand"><img data-k="rest" src="img/hand_rest.webp?v=1" class="on"><img data-k="fist" src="img/hand_fist.webp?v=1"><img data-k="up" src="img/hand_up.webp?v=1"></div>
  <div id="zz"></div>
  <div id="say" class="say" hidden></div>
  <div id="mon"><div class="rod"></div><div class="scr"><small id="monL"></small><span id="monT">2:00</span></div></div>
  <button id="bMute" aria-label="sound"></button>
  <button id="bHand" aria-label="raise hand"></button>
  <div id="hint" hidden></div>
  <div id="tut" hidden><div class="tc"><p id="tutP"></p><button id="tutB"></button></div></div>
</main>

<main id="vResult" class="view" hidden>
  <div id="kWrap"><canvas id="karte" width="900" height="1200"></canvas></div>
  <div id="rBtns"><button id="bAgain" data-t="again"></button><button class="s" id="bSave" data-t="save"></button><button class="s" id="bPost" data-t="post"></button><button class="s" id="bTitle" data-t="toTitle"></button></div>
  <div id="rMsg" hidden></div>
</main>

<script>
// ブラウザの拡大を止める（ピンチ・ダブルタップ・トラックパッドのピンチ・Ctrl+ホイール/キー）。iOS は user-scalable=no を無視するので JS でも止める
(function(){
  var opt={passive:false};
  ['gesturestart','gesturechange','gestureend'].forEach(function(n){document.addEventListener(n,function(e){e.preventDefault()},opt)});
  document.addEventListener('touchmove',function(e){if(e.touches&&e.touches.length>1)e.preventDefault()},opt);
  var last=0;document.addEventListener('touchend',function(e){var n=Date.now();if(n-last<300&&!(e.target.closest&&e.target.closest('button,a')))e.preventDefault();last=n},opt);
  document.addEventListener('dblclick',function(e){e.preventDefault()},opt);
  window.addEventListener('wheel',function(e){if(e.ctrlKey)e.preventDefault()},opt);
  window.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&['+','-','=','0',';'].indexOf(e.key)>=0)e.preventDefault()});
})();
// 起動失敗の保険。JS が動いたか（__jsUp）で判定し、読み込み中は失敗と出さない
(function(){
  var errs=[];
  window.addEventListener('error',function(e){errs.push((e.message||'error')+' @'+(e.filename||'')+':'+(e.lineno||''))});
  window.addEventListener('unhandledrejection',function(e){errs.push('reject: '+(e.reason&&e.reason.message||e.reason))});
  setTimeout(function(){
    if(window.__jsUp && !errs.length) return;
    if(window.__dhReady) return;
    var d=document.createElement('div');d.id='boot-err';
    d.textContent='起動できませんでした / failed to start\n'+(errs.join('\n')||'(no error captured)')+'\n'+navigator.userAgent;
    document.body.appendChild(d);
  },6000);
})();
</script>
